      <rect x="24" y="100" width="128" height="38" rx="10" fill="#101C25" stroke="#68A063" stroke-opacity=".5"/><text x="43" y="124">Node.js</text>
      <rect x="164" y="100" width="148" height="38" rx="10" fill="#101C25" stroke="#E2E8F0" stroke-opacity=".35"/><text x="182" y="124">Express</text>
      <rect x="24" y="150" width="140" height="38" rx="10" fill="#101C25" stroke="#47A248" stroke-opacity=".5"/><text x="43" y="174">MongoDB</text>
      <rect x="176" y="150" width="136" height="38" rx="10" fill="#101C25" stroke="#4479A1" stroke-opacity=".55"/><text x="195" y="174">MySQL</text>
      <rect x="24" y="200" width="128" height="38" rx="10" fill="#101C25" stroke="#3178C6" stroke-opacity=".55"/><text x="43" y="224">TypeScript</text>
      <rect x="164" y="200" width="148" height="38" rx="10" fill="#101C25" stroke="#22D3EE" stroke-opacity=".45"/><text x="182" y="224">REST APIs</text>
    </g>
    <rect x="24" y="260" width="288" height="2" fill="#1E293B"/><rect x="24" y="260" width="90" height="2" fill="#22D3EE"><animate attributeName="width" values="288;70;288" dur="5.6s" repeatCount="indefinite"/></rect>
  </g>

  <g transform="translate(806 158)">
