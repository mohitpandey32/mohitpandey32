    <circle cx="30" cy="34" r="10" fill="#34D399" fill-opacity=".2"/><circle cx="30" cy="34" r="4" fill="#34D399"><animate attributeName="opacity" values="1;.25;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <text x="52" y="39" fill="#D1FAE5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">CORE + TOOLS</text>
    <text x="24" y="78" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">LOGIC, WORKFLOW &amp; DELIVERY</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#E2E8F0">
