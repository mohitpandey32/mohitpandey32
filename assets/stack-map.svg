      <rect x="164" y="100" width="148" height="38" rx="10" fill="#15152B" stroke="#F7DF1E" stroke-opacity=".4"/><text x="182" y="124">JavaScript</text>
      <rect x="24" y="150" width="140" height="38" rx="10" fill="#15152B" stroke="#38BDF8" stroke-opacity=".45"/><text x="43" y="174">Tailwind</text>
      <rect x="176" y="150" width="136" height="38" rx="10" fill="#15152B" stroke="#F97316" stroke-opacity=".4"/><text x="195" y="174">HTML / CSS</text>
      <rect x="24" y="200" width="128" height="38" rx="10" fill="#15152B" stroke="#F24E1E" stroke-opacity=".4"/><text x="43" y="224">Figma</text>
