<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Technology constellation</title><desc id="desc">Mohit's tools grouped as interface, full stack, and core engineering skills.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500"><stop stop-color="#0B1020"/><stop offset=".5" stop-color="#101329"/><stop offset="1" stop-color="#07141D"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#7C3AED" stop-opacity=".25"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94A3B8" fill-opacity=".09"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect x="1" y="1" width="1198" height="498" rx="26" fill="url(#bg)" stroke="#293548"/><rect x="1" y="1" width="1198" height="498" rx="26" fill="url(#dots)"/>
  <text x="56" y="62" fill="#A78BFA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">02 / TECHNOLOGY CONSTELLATION</text>
  <text x="56" y="102" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="27" font-weight="720">The systems behind the screen.</text>
  <text x="1144" y="69" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="end">CRAFT → CORE → SCALE</text>
  <path d="M56 124H1144" stroke="#334155"/><path d="M56 124H310" stroke="url(#edge)" stroke-width="2"><animate attributeName="d" values="M56 124H230;M56 124H620;M56 124H230" dur="6s" repeatCount="indefinite"/></path>
  <circle cx="600" cy="305" r="192" fill="url(#halo)" filter="url(#blur)"/>
  <g stroke="#7C3AED" stroke-opacity=".18"><path d="M200 250L600 310L1000 250"/><path d="M200 376L600 310L1000 376"/><circle cx="600" cy="310" r="96" stroke-dasharray="4 8"><animateTransform attributeName="transform" type="rotate" values="0 600 310;360 600 310" dur="30s" repeatCount="indefinite"/></circle></g>

