    <circle cx="30" cy="34" r="10" fill="#22D3EE" fill-opacity=".22"/><circle cx="30" cy="34" r="4" fill="#22D3EE"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
