      <rect x="164" y="100" width="148" height="38" rx="10" fill="#0F1E1D" stroke="#ED8B00" stroke-opacity=".5"/><text x="182" y="124">Java</text>
      <rect x="24" y="150" width="140" height="38" rx="10" fill="#0F1E1D" stroke="#3776AB" stroke-opacity=".6"/><text x="43" y="174">Python</text>
      <rect x="176" y="150" width="136" height="38" rx="10" fill="#0F1E1D" stroke="#F05032" stroke-opacity=".55"/><text x="195" y="174">Git</text>
      <rect x="24" y="200" width="128" height="38" rx="10" fill="#0F1E1D" stroke="#FF6C37" stroke-opacity=".5"/><text x="43" y="224">Postman</text>
      <rect x="164" y="200" width="148" height="38" rx="10" fill="#0F1E1D" stroke="#34D399" stroke-opacity=".45"/><text x="182" y="224">DSA</text>
    </g>
    <rect x="24" y="260" width="288" height="2" fill="#1E293B"/><rect x="24" y="260" width="90" height="2" fill="#34D399"><animate attributeName="x" values="24;222;24" dur="5.2s" repeatCount="indefinite"/></rect>
  </g>
</svg>

