<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mohit Pandey — Frontend Developer and Problem Solver</title>
  <desc id="desc">An animated dark technology banner with a terminal-inspired interface.</desc>

  <defs>
    <linearGradient id="bg" x1="90" y1="25" x2="1110" y2="335" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D18" />
      <stop offset="0.48" stop-color="#0D1224" />
      <stop offset="1" stop-color="#090C16" />
    </linearGradient>
    <linearGradient id="accent" x1="307" y1="102" x2="836" y2="252" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="0.52" stop-color="#7C3AED" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#7C3AED" stop-opacity="0.48" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#94A3B8" stroke-opacity="0.055" />
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26" />
    </filter>
    <filter id="textGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blurred" />
      <feMerge>
        <feMergeNode in="blurred" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="22" y="22" width="1156" height="316" rx="24" />
    </clipPath>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)" />
  <g clip-path="url(#frameClip)">
    <rect x="22" y="22" width="1156" height="316" fill="url(#grid)" />

    <circle cx="174" cy="92" r="235" fill="url(#violetGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="150;230;150" dur="9s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;135;80" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="278" r="250" fill="url(#cyanGlow)" filter="url(#blur)">
      <animate attributeName="cx" values="1050;970;1050" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="280;220;280" dur="8s" repeatCount="indefinite" />
    </circle>

    <g opacity="0.7">
      <circle cx="106" cy="78" r="2" fill="#A78BFA">
        <animate attributeName="opacity" values="0.15;1;0.15" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="1095" cy="98" r="2" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.1;1" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="1030" cy="300" r="1.8" fill="#A78BFA">
        <animate attributeName="opacity" values="0.1;1;0.1" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="166" cy="285" r="1.5" fill="#22D3EE">
        <animate attributeName="opacity" values="1;0.15;1" dur="3.2s" repeatCount="indefinite" />
      </circle>
    </g>

    <g transform="translate(80 72)">
      <rect width="270" height="214" rx="16" fill="#080B14" fill-opacity="0.82" stroke="#334155" stroke-opacity="0.75" />
      <path d="M0 44H270" stroke="#334155" stroke-opacity="0.65" />
      <circle cx="24" cy="22" r="5" fill="#FB7185" />
      <circle cx="43" cy="22" r="5" fill="#FBBF24" />
      <circle cx="62" cy="22" r="5" fill="#34D399" />
      <text x="134" y="27" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">mohit@github</text>

      <text x="22" y="76" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$</text>
      <text x="38" y="76" fill="#C4B5FD" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">whoami</text>
      <text x="22" y="103" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">frontend_developer</text>

      <text x="22" y="136" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">$</text>
      <text x="38" y="136" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">status</text>
      <circle cx="28" cy="163" r="4" fill="#34D399">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="40" y="168" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">building something useful</text>

      <rect x="22" y="190" width="8" height="14" rx="1" fill="#A78BFA">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>

    <g transform="translate(406 0)">
      <text x="0" y="118" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="4">HELLO, I'M</text>
      <text x="0" y="183" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800" letter-spacing="1" filter="url(#textGlow)">MOHIT PANDEY</text>
      <rect x="0" y="202" width="625" height="2" rx="1" fill="#1E293B" />
      <rect x="0" y="202" width="168" height="2" rx="1" fill="url(#accent)">
        <animate attributeName="x" values="0;457;0" dur="5s" repeatCount="indefinite" />
      </rect>
      <text x="0" y="241" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">FRONTEND DEVELOPER</text>
      <text x="260" y="241" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">//</text>
      <text x="302" y="241" fill="#CBD5E1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2">PROBLEM SOLVER</text>
      <text x="0" y="278" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">DESIGNING WITH INTENT · BUILDING WITH CODE</text>
    </g>

    <rect x="22" y="22" width="1156" height="316" rx="24" stroke="url(#accent)" stroke-opacity="0.28" />
    <rect x="-220" y="0" width="110" height="360" fill="url(#accent)" opacity="0.055" transform="skewX(-18)">
      <animate attributeName="x" values="-220;1420" dur="7s" repeatCount="indefinite" />
    </rect>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#334155" stroke-opacity="0.55" />
</svg>

